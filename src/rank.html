<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>排行榜 — 我现在火气很大</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #FFF8D6; min-height: 100vh; }
.page { width: 100%; max-width: 414px; margin: 0 auto; padding-bottom: 70px; }
.top-bar { background: #FFE899; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.top-bar .back-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.7); font-size: 18px; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; }
.top-bar .back-btn:active { background: #FFF; }
.top-bar .title { font-size: 17px; font-weight: 700; color: #555; }
.tabs { display: flex; padding: 12px 16px; gap: 10px; position: sticky; top: 60px; z-index: 9; background: #FFF8D6; }
.tab-btn { flex: 1; padding: 10px 0; border-radius: 20px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
.tab-btn.anger-tab { background: #FFF; color: #FFAB76; border: 1.5px solid #FFE0C0; }
.tab-btn.anger-tab.active { background: #FFAB76; color: #FFF; border-color: #FFAB76; box-shadow: 0 3px 12px rgba(255,171,118,0.3); }
.tab-btn.tolerance-tab { background: #FFF; color: #81C784; border: 1.5px solid #C8E6C9; }
.tab-btn.tolerance-tab.active { background: #81C784; color: #FFF; border-color: #81C784; box-shadow: 0 3px 12px rgba(129,199,132,0.3); }
.champion-card { margin: 0 16px 14px; background: #FFF; border-radius: 20px; padding: 24px 20px; text-align: center; box-shadow: 0 3px 20px rgba(0,0,0,0.06); display: none; }
.champion-card.show { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.champion-card .crown { font-size: 44px; animation: crownBounce 1.5s ease-in-out infinite; }
@keyframes crownBounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.08); } }
.champion-card .champ-avatar { width: 72px; height: 72px; border-radius: 50%; background: #F5F5F5; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 3px solid #FFD54F; box-shadow: 0 0 20px rgba(255,213,79,0.4); }
.champion-card .champ-name { font-size: 18px; font-weight: 800; color: #555; }
.champion-card .champ-title { display: inline-block; padding: 3px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-top: 4px; }
.champion-card .champ-title.anger-king { background: #FFEBEE; color: #E53935; }
.champion-card .champ-title.tolerance-king { background: #E8F5E9; color: #2E7D32; }
.champion-card .champ-value { font-size: 32px; font-weight: 800; margin-top: 6px; }
.champion-card .champ-value.anger-color { color: #FFAB76; }
.champion-card .champ-value.tolerance-color { color: #81C784; }
.rank-list { padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
.rank-item { background: #FFF; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.03); transition: transform 0.15s; }
.rank-item.is-me { background: #FFFDE7; border: 1.5px solid #FFE899; }
.rank-item .rank-num { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; color: #999; background: #F5F5F5; }
.rank-item .rank-num.top1 { background: #FFD54F; color: #FFF; font-size: 18px; }
.rank-item .rank-num.top2 { background: #CFD8DC; color: #FFF; font-size: 16px; }
.rank-item .rank-num.top3 { background: #FFCC80; color: #FFF; font-size: 16px; }
.rank-item .rank-avatar { width: 40px; height: 40px; border-radius: 50%; background: #F5F5F5; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.rank-item .rank-title-tag { font-size: 10px; padding: 1px 8px; border-radius: 8px; font-weight: 700; margin-left: 4px; }
.rank-item .rank-title-tag.best-friend { background: linear-gradient(135deg, #FF6B35, #FFD54F, #FFAB76); background-size: 200% 200%; color: #FFF; font-size: 10px; padding: 2px 9px; border-radius: 9px; font-weight: 800; animation: bestShine 2s ease-in-out infinite; box-shadow: 0 1px 6px rgba(255,107,53,0.45); }
@keyframes bestShine { 0%,100% { background-position: 0% 50%; box-shadow: 0 1px 6px rgba(255,107,53,0.45); } 50% { background-position: 100% 50%; box-shadow: 0 3px 12px rgba(255,171,118,0.75); } }
.rank-item .rank-info { flex: 1; min-width: 0; }
.rank-item .rank-name { font-size: 14px; font-weight: 600; color: #555; display: flex; align-items: center; gap: 4px; }
.rank-item .rank-id { font-size: 10px; color: #BBB; }
.rank-item .rank-value { font-size: 18px; font-weight: 800; flex-shrink: 0; }
.rank-item .rank-value.anger-color { color: #FFAB76; }
.rank-item .rank-value.tolerance-color { color: #81C784; }
.rank-item .rank-me-tag { font-size: 10px; color: #FFAB76; font-weight: 600; background: #FFF3E0; padding: 1px 8px; border-radius: 8px; margin-left: 6px; }
.empty-rank { text-align: center; padding: 48px 20px; color: #CCC; }
.empty-rank .empty-icon { font-size: 48px; margin-bottom: 10px; }
.empty-rank .empty-text { font-size: 14px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #FFF; display: flex; border-top: 1px solid #EEE; max-width: 414px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
.bottom-nav .nav-item { flex: 1; text-align: center; padding: 8px 0 6px; cursor: pointer; color: #BBB; transition: all 0.15s; text-decoration: none; font-size: 10px; }
.bottom-nav .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 1px; }
.bottom-nav .nav-item:active { background: #FAFAFA; }
.bottom-nav .nav-item.active { color: #B8D8FF; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar"><button class="back-btn" onclick="history.back()">←</button><span class="title">圈子排行榜</span></div>
  <div class="tabs">
    <button class="tab-btn anger-tab active" id="anger-tab" onclick="switchTab('anger')">🔥 火气排行榜</button>
    <button class="tab-btn tolerance-tab" id="tolerance-tab" onclick="switchTab('tolerance')">💚 包容排行榜</button>
  </div>
  <div class="champion-card" id="champion-card"></div>
  <div class="rank-list" id="rank-list"></div>
  <div class="empty-rank" id="empty-rank"><div class="empty-icon">🏜️</div><div class="empty-text">还没有好友数据，去加好友吧</div></div>
<div class="bottom-nav"><div class="nav-item" onclick="location.href='friend.html'"><span class="nav-icon">🏠</span>好友</div><div class="nav-item active" onclick="location.href='rank.html'"><span class="nav-icon">🏆</span>排行</div><div class="nav-item" onclick="location.href='recommend.html'"><span class="nav-icon">🌟</span>推荐</div><div class="nav-item" onclick="location.href='shop.html'"><span class="nav-icon">🛍️</span>商城</div><div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span>主页</div></div>
</div>
<script src="js/data.js"></script>
<script>
const currentUser = HQ.UserDB.current();
if (!currentUser) { window.location.href = 'login.html'; }
let currentTab = 'anger';
function switchTab(tab) { currentTab = tab; document.getElementById('anger-tab').classList.toggle('active', tab==='anger'); document.getElementById('tolerance-tab').classList.toggle('active', tab==='tolerance'); renderRank(); }
function renderRank() {
  HQ.RankAPI.getRankings(currentTab, currentUser.id).then(function(data) {
  const listEl = document.getElementById('rank-list'), emptyEl = document.getElementById('empty-rank'), champEl = document.getElementById('champion-card');
  if (!data || data.length === 0) { emptyEl.style.display = 'block'; listEl.innerHTML = ''; champEl.classList.remove('show'); return; }
  emptyEl.style.display = 'none';
  const champ = data[0]; const isAnger = currentTab === 'anger';
  const kingTitle = isAnger ? '火气大王' : '包容大王';
  champEl.classList.add('show');
  champEl.innerHTML = '<div class="crown">👑</div><div class="champ-avatar">😶</div><div class="champ-name">'+champ.nickname+(champ.id===currentUser.id?' <span style="font-size:11px;color:#FFAB76">（你）</span>':'')+'</div><div class="champ-title '+(isAnger?'anger-king':'tolerance-king')+'">'+kingTitle+'</div><div class="champ-value '+(isAnger?'anger-color':'tolerance-color')+'">'+(isAnger?'🔥':'💚')+' '+(champ[isAnger?'anger':'tolerance']||0)+'</div>'+(champ.title?'<div style="margin-top:4px;font-size:11px;color:#81C784;font-weight:600">🏅 '+champ.title+'</div>':'');
  listEl.innerHTML = data.map((u,idx) => {
    const rank=idx+1; let nc='',medal='';
    if(rank===1){nc='top1';medal='🥇';}else if(rank===2){nc='top2';medal='🥈';}else if(rank===3){nc='top3';medal='🥉';}
    const isMe=u.id===currentUser.id; const val=u[isAnger?'anger':'tolerance']||0;
    return '<div class="rank-item'+(isMe?' is-me':'')+'"><div class="rank-num '+nc+'">'+(medal||rank)+'</div><div class="rank-avatar">😶</div><div class="rank-info"><div class="rank-name">'+u.nickname+(u.title?'<span class="rank-title-tag best-friend">'+u.title+'</span>':'')+(isMe?'<span class="rank-me-tag">我</span>':'')+'</div><div class="rank-id">ID: '+u.id+'</div></div><div class="rank-value '+(isAnger?'anger-color':'tolerance-color')+'">'+(isAnger?'🔥':'💚')+' '+val+'</div></div>';
  }).join('');
  });
}
switchTab('anger');
</script>
</body>
</html>
