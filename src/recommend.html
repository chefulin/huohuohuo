<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>推荐榜 — 我现在火气很大</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #FFF8D6; min-height: 100vh; }
.page { width: 100%; max-width: 414px; margin: 0 auto; padding-bottom: 70px; }
.top-bar { background: #FFE899; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
.top-bar .back-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.7); font-size: 18px; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; }
.top-bar .back-btn:active { background: #FFF; }
.top-bar .title { font-size: 16px; font-weight: 700; color: #555; }
.info-banner { margin: 12px 16px; background: #FFF; border-radius: 14px; padding: 14px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border-left: 4px solid #81C784; }
.info-banner .banner-title { font-size: 14px; font-weight: 700; color: #555; }
.info-banner .banner-desc { font-size: 12px; color: #999; margin-top: 4px; line-height: 1.6; }
.info-banner .banner-week { display: inline-block; background: #E8F5E9; color: #2E7D32; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-top: 6px; }
.my-status { margin: 0 16px 12px; background: #FFF; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 14px; }
.my-status .status-icon { font-size: 36px; flex-shrink: 0; }
.my-status .status-info { flex: 1; }
.my-status .status-title { font-size: 14px; font-weight: 700; }
.my-status .status-title.qualified { color: #2E7D32; }
.my-status .status-title.not-qualified { color: #999; }
.my-status .status-detail { font-size: 11px; color: #BBB; margin-top: 3px; line-height: 1.5; }
.my-status .status-progress { margin-top: 8px; height: 8px; background: #F0F0F0; border-radius: 4px; overflow: hidden; }
.my-status .status-progress-bar { height: 100%; background: linear-gradient(90deg, #81C784, #4CAF50); border-radius: 4px; transition: width 0.5s; }
.section-header { padding: 0 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.section-header .section-title { font-size: 14px; font-weight: 700; color: #999; }
.section-header .section-count { font-size: 11px; color: #81C784; font-weight: 600; }
.recommend-list { padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
.rec-item { background: #FFF; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.03); }
.rec-item .rec-rank { width: 30px; font-size: 14px; font-weight: 800; text-align: center; flex-shrink: 0; }
.rec-item .rec-rank.top1 { color: #FFD54F; font-size: 20px; }
.rec-item .rec-rank.top2 { color: #B0BEC5; font-size: 18px; }
.rec-item .rec-rank.top3 { color: #FFCC80; font-size: 18px; }
.rec-item .rec-avatar { width: 44px; height: 44px; border-radius: 50%; background: #F5F5F5; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; position: relative; }
.rec-item .rec-avatar .rec-badge { position: absolute; bottom: -2px; right: -4px; font-size: 14px; }
.rec-item .rec-info { flex: 1; min-width: 0; }
.rec-item .rec-name { font-size: 14px; font-weight: 600; color: #555; display: flex; align-items: center; gap: 6px; }
.rec-item .rec-name .best-tag { font-size: 10px; background: linear-gradient(135deg, #FF6B35, #FFD54F, #FFAB76); background-size: 200% 200%; color: #FFF; padding: 3px 10px; border-radius: 10px; font-weight: 800; letter-spacing: 0.5px; animation: bestShine 2s ease-in-out infinite; box-shadow: 0 2px 8px rgba(255,107,53,0.5); }
@keyframes bestShine { 0%,100% { background-position: 0% 50%; box-shadow: 0 2px 8px rgba(255,107,53,0.5); } 50% { background-position: 100% 50%; box-shadow: 0 3px 14px rgba(255,171,118,0.8); } }
.rec-item .rec-id { font-size: 10px; color: #BBB; }
.rec-item .rec-tolerance { font-size: 16px; font-weight: 800; color: #81C784; flex-shrink: 0; }
.rec-item .add-btn { padding: 8px 18px; border-radius: 18px; border: none; background: #B8D8FF; font-size: 12px; font-weight: 700; color: #555; cursor: pointer; flex-shrink: 0; }
.rec-item .add-btn:active { background: #A0C8F8; }
.rec-item .add-btn:disabled { background: #F0F0F0; color: #BBB; cursor: default; }
.empty-state { text-align: center; padding: 48px 20px; color: #CCC; }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 10px; }
.empty-state .empty-text { font-size: 14px; }
.empty-state .empty-sub { font-size: 11px; color: #DDD; margin-top: 4px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 999; animation: slideDown 0.3s ease; }
.toast.success { background: #81C784; color: #FFF; }
.toast.info { background: #B8D8FF; color: #555; }
@keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #FFF; display: flex; border-top: 1px solid #EEE; max-width: 414px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
.bottom-nav .nav-item { flex: 1; text-align: center; padding: 8px 0 6px; cursor: pointer; color: #BBB; transition: all 0.15s; text-decoration: none; font-size: 10px; }
.bottom-nav .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 1px; }
.bottom-nav .nav-item:active { background: #FAFAFA; }
.bottom-nav .nav-item.active { color: #B8D8FF; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar"><button class="back-btn" onclick="history.back()">←</button><span class="title">全平台好友推荐榜</span></div>
  <div class="info-banner">
    <div class="banner-title">🏅 最值得交往的朋友</div>
    <div class="banner-desc">连续7天（自然周一至周日）每日包容值 ≥ 999 的用户可上榜。<br>每周一自动刷新资格，不达标自动撤榜。</div>
    <div class="banner-week" id="week-range">本周 ---</div>
  </div>
  <div class="my-status" id="my-status"></div>
  <div class="section-header"><span class="section-title">🏆 本周达标用户</span><span class="section-count" id="qualified-count"></span></div>
  <div class="recommend-list" id="recommend-list"></div>
  <div class="empty-state" id="empty-state"><div class="empty-icon">🌙</div><div class="empty-text">本周暂无达标用户</div><div class="empty-sub">连续7天每日包容≥999 即可上榜</div></div>
<div class="bottom-nav"><div class="nav-item" onclick="location.href='friend.html'"><span class="nav-icon">🏠</span>好友</div><div class="nav-item" onclick="location.href='rank.html'"><span class="nav-icon">🏆</span>排行</div><div class="nav-item active" onclick="location.href='recommend.html'"><span class="nav-icon">🌟</span>推荐</div><div class="nav-item" onclick="location.href='shop.html'"><span class="nav-icon">🛍️</span>商城</div><div class="nav-item" onclick="location.href='share.html'"><span class="nav-icon">📤</span>分享</div></div>
</div>
<script src="js/data.js"></script>
<script>
const currentUser = HQ.UserDB.current();
if (!currentUser) { window.location.href = 'login.html'; }
function init() { refreshUser(); renderWeekRange(); renderMyStatus(); renderRecommendList(); }
function refreshUser() { const u = HQ.UserDB.findById(currentUser.id); if (u) Object.assign(currentUser, u); }
function renderWeekRange() { const week = HQ.WeeklyEngine.getCurrentWeek(); document.getElementById('week-range').textContent = '本周：'+week.monday+' ~ '+week.sunday; }
function renderMyStatus() {
  refreshUser(); const week = HQ.WeeklyEngine.getCurrentWeek();
  const daily = currentUser.dailyTolerance || {};
  const checked = HQ.WeeklyEngine.checkWeeklyQualify(currentUser.id);
  let qd=0; const today=new Date().toISOString().split('T')[0];
  week.dates.forEach(d=>{ if(d<=today&&(daily[d]||0)>=999)qd++; });
  const pct=Math.min(100,Math.round(qd/7*100)); const isQ=checked;
  document.getElementById('my-status').innerHTML='<div class="status-icon">'+(isQ?'🏅':'📅')+'</div><div class="status-info"><div class="status-title '+(isQ?'qualified':'not-qualified')+'">'+(isQ?'🎉 恭喜！你已上榜！':'你还未达标')+'</div><div class="status-detail">本周已达标 <b style="color:#81C784">'+qd+'</b> / 7 天（需连续7天每日包容≥999）<br>当前包容值：<b style="color:#81C784">'+(currentUser.tolerance||0)+'</b></div><div class="status-progress"><div class="status-progress-bar" style="width:'+pct+'%"></div></div></div>';
}
function renderRecommendList() {
  refreshUser();
  HQ.RankAPI.getRecommend().then(function(res) {
  var qualified = res.users || [];
  document.getElementById('qualified-count').textContent = qualified.length > 0 ? qualified.length+' 人上榜' : '';
  var listEl = document.getElementById('recommend-list'), emptyEl = document.getElementById('empty-state');
  if (qualified.length === 0) { emptyEl.style.display = 'block'; listEl.innerHTML = ''; return; }
  emptyEl.style.display = 'none';
  listEl.innerHTML = qualified.map(function(u, idx) {
    const rank=idx+1; let rc='',rm='';
    if(rank===1){rc='top1';rm='🥇';}else if(rank===2){rc='top2';rm='🥈';}else if(rank===3){rc='top3';rm='🥉';}
    const isMe=u.id===currentUser.id; const isF=HQ.FriendDB.isFriend(currentUser.id,u.id);
    const pending=HQ.RequestDB.getPending(u.id).some(r=>r.from===currentUser.id);
    let btnH=''; if(isMe)btnH='<span style="font-size:11px;color:#81C784;font-weight:600">你自己</span>'; else if(isF)btnH='<span style="font-size:11px;color:#999">已是好友</span>'; else if(pending)btnH='<button class="add-btn" disabled>已申请</button>'; else btnH='<button class="add-btn" onclick="sendReqFromRec(\''+u.id+'\')">加好友</button>';
    return '<div class="rec-item"><div class="rec-rank '+rc+'">'+(rm||rank)+'</div><div class="rec-avatar">😶<span class="rec-badge">'+(rank===1?'👑':rank===2?'⭐':rank===3?'🌟':'')+'</span></div><div class="rec-info"><div class="rec-name">'+u.nickname+'<span class="best-tag">最值得交往的朋友</span>'+(isMe?'<span style="font-size:10px;color:#FFAB76;font-weight:600">（你）</span>':'')+'</div><div class="rec-id">ID: '+u.id+'</div></div><div class="rec-tolerance">💚 '+(u.tolerance||0)+'</div>'+btnH+'</div>';
  }).join('');
  });
}
function sendReqFromRec(toId) { HQ.RequestDB.send(currentUser.id,toId).then(function(res) { showToast(res.success?'申请已发送 📩':res.error,res.success?'success':'info'); if(res.success)renderRecommendList(); }); }
function showToast(msg,type) { const t=document.createElement('div'); t.className='toast '+(type||'info'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
init();
</script>
</body>
</html>
